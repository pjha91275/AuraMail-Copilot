<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="460" height="110">
  <defs>
    <!-- Background Gradient for Icon Squircle -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Ribbon Gradient -->
    <linearGradient id="logoRibbonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Flap Gradient -->
    <linearGradient id="logoFlapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Star Glow Gradient -->
    <linearGradient id="logoStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Text Gradient for "AuraMail" -->
    <linearGradient id="brandTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Text Gradient for "AI" -->
    <linearGradient id="aiBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starGlowFull" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left: The Custom Aura Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Squircle Base -->
    <rect x="0" y="0" width="90" height="90" rx="26" fill="url(#logoBgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <rect x="4" y="4" width="82" height="82" rx="22" fill="none" stroke="url(#logoRibbonGrad)" stroke-width="1.5" stroke-opacity="0.35"/>

    <!-- Glowing Envelope & Aura Wings -->
    <g filter="url(#logoGlow)">
      <!-- Envelope Outer -->
      <path d="M20 32 C20 27 24 24 29 24 L61 24 C66 24 70 27 70 32 L70 62 C70 67 66 70 61 70 L29 70 C24 70 20 67 20 62 Z" 
            fill="none" 
            stroke="url(#logoRibbonGrad)" 
            stroke-width="4" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

      <!-- Intersecting Wing Fold (Aura "A") -->
      <path d="M22 29 L45 50 L68 29" 
            fill="none" 
            stroke="url(#logoFlapGrad)" 
            stroke-width="4" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

      <!-- Bottom Flap Wings -->
      <path d="M22 65 L37 47" fill="none" stroke="url(#logoRibbonGrad)" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.8"/>
      <path d="M68 65 L53 47" fill="none" stroke="url(#logoRibbonGrad)" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.8"/>

      <!-- Center AI Node -->
      <circle cx="45" cy="50" r="3.5" fill="#38bdf8"/>
    </g>

    <!-- Star Sparkle -->
    <g filter="url(#starGlowFull)" transform="translate(60, 8)">
      <path d="M10 0 L12 7 L19 9 L12 11 L10 18 L8 11 L1 9 L8 7 Z" fill="url(#logoStarGrad)"/>
      <circle cx="10" cy="9" r="2" fill="#ffffff"/>
    </g>
  </g>

  <!-- Right: Typography & Tagline -->
  <g transform="translate(122, 16)">
    <!-- Brand Name: AuraMail -->
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" fill="#0f172a" letter-spacing="-1">
      AuraMail
    </text>

    <!-- AI Badge -->
    <g transform="translate(182, 14)">
      <rect x="0" y="0" width="54" height="28" rx="8" fill="url(#aiBadgeGrad)"/>
      <text x="27" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
        AI
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="2" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#64748b" letter-spacing="2.5">
      EXECUTIVE EMAIL COPILOT
    </text>
  </g>
</svg>
