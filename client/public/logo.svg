<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="auramailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10)">
    <rect width="80" height="80" rx="22" fill="url(#auramailGrad)" filter="url(#glow)"/>
    <!-- Modern Mail & Sparkle Icon -->
    <path d="M22 28 C22 24.68 24.68 22 28 22 L52 22 C55.32 22 58 24.68 58 28 L58 52 C58 55.32 55.32 58 52 58 L28 58 C24.68 58 22 55.32 22 52 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="23,27 40,41 57,27" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- AI Sparkle Star -->
    <path d="M56 16 L58 22 L64 24 L58 26 L56 32 L54 26 L48 24 L54 22 Z" fill="#fbbf24"/>
  </g>

  <!-- Typography -->
  <text x="108" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="800" font-size="36" fill="#1e293b" letter-spacing="-0.5">
    AuraMail<tspan fill="#3b82f6"> AI</tspan>
  </text>
  <text x="110" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="500" font-size="13" fill="#64748b" letter-spacing="1">
    EXECUTIVE EMAIL COPILOT
  </text>
</svg>
