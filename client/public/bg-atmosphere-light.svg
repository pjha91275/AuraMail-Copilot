<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <!-- Crisp Pearlescent Light Canvas Base (Comfortable Ice-Slate Tint, NOT bright white) -->
    <radialGradient id="lightBase" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#ebf1f8"/>
      <stop offset="45%" stop-color="#e2eaf4"/>
      <stop offset="100%" stop-color="#d6e1ee"/>
    </radialGradient>

    <!-- Multi-Layered Glow & Shine Filter for Light Mode -->
    <filter id="intenseLightGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="14" flood-color="rgba(37, 99, 235, 0.28)"/>
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="rgba(99, 102, 241, 0.35)"/>
    </filter>

    <filter id="starShineBurstLight" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nebulaSmudgeLight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>

    <!-- Clean Tech Matrix Grid -->
    <pattern id="lightGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(148, 163, 184, 0.14)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(99, 102, 241, 0.2)"/>
    </pattern>

    <!-- Logo Gradients for Light Mode -->
    <linearGradient id="logoRibbonLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="35%" stop-color="#4f46e5"/>
      <stop offset="70%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="logoFlapLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="logoStarLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- ============================================================ -->
    <!-- RICH COLOR SMUDGE GRADIENTS FOR LIGHT MODE (HOLLOW PORTIONS) -->
    <!-- ============================================================ -->
    
    <!-- 1. Upper-Center Cyan Nebula -->
    <radialGradient id="lightSmudgeUpperCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#bae6fd" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e2eaf4" stop-opacity="0"/>
    </radialGradient>

    <!-- 2. Mid-Center Violet Aurora -->
    <radialGradient id="lightSmudgeMidCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#c084fc" stop-opacity="0.16"/>
      <stop offset="75%" stop-color="#ddd6fe" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#e2eaf4" stop-opacity="0"/>
    </radialGradient>

    <!-- 3. Left-Center Orchid Violet -->
    <radialGradient id="lightSmudgeLeftCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#e879f9" stop-opacity="0.16"/>
      <stop offset="75%" stop-color="#f5d0fe" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#e2eaf4" stop-opacity="0"/>
    </radialGradient>

    <!-- 4. Right-Center Emerald Teal -->
    <radialGradient id="lightSmudgeRightCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="75%" stop-color="#a7f3d0" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#e2eaf4" stop-opacity="0"/>
    </radialGradient>

    <!-- 5. Bottom-Center Deep Indigo -->
    <radialGradient id="lightSmudgeBottomCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#c7d2fe" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e2eaf4" stop-opacity="0"/>
    </radialGradient>

    <!-- Halo Gradients for Light Mode Logos -->
    <radialGradient id="haloCyanLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#bae6fd" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e2eaf4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="haloIndigoLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#c7d2fe" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e2eaf4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="haloPurpleLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ddd6fe" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e2eaf4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="haloTealLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.20"/>
      <stop offset="60%" stop-color="#99f6e4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#e2eaf4" stop-opacity="0"/>
    </radialGradient>

    <!-- Reusable Logo Symbol Template for Light Mode -->
    <g id="auraMailLogoLightWatermark">
      <path d="M16 38 C16 30 22 24 30 24 L98 24 C106 24 112 30 112 38 L112 94 C112 102 106 108 98 108 L30 108 C22 108 16 102 16 94 Z" 
            fill="none" 
            stroke="url(#logoRibbonLight)" 
            stroke-width="7.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

      <path d="M18 32 L64 74 L110 32" 
            fill="none" 
            stroke="url(#logoFlapLight)" 
            stroke-width="7.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

      <path d="M18 100 L50 68" fill="none" stroke="url(#logoRibbonLight)" stroke-width="6.5" stroke-linecap="round" stroke-opacity="0.95"/>
      <path d="M110 100 L78 68" fill="none" stroke="url(#logoRibbonLight)" stroke-width="6.5" stroke-linecap="round" stroke-opacity="0.95"/>

      <circle cx="64" cy="74" r="8" fill="#38bdf8" opacity="0.4"/>
      <circle cx="64" cy="74" r="5" fill="#0284c7"/>
      <circle cx="64" cy="74" r="2.5" fill="#ffffff"/>

      <g transform="translate(86, 6)" filter="url(#starShineBurstLight)">
        <!-- Horizontal & Vertical Shine Rays -->
        <line x1="16" y1="-12" x2="16" y2="42" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
        <line x1="-12" y1="15" x2="44" y2="15" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

        <!-- Star Diamond Geometry -->
        <path d="M16 0 L20 11.5 L31 15 L20 18.5 L16 30 L12 18.5 L1 15 L12 11.5 Z" fill="url(#logoStarLight)"/>
        <circle cx="16" cy="15" r="4" fill="#ffffff"/>
      </g>
    </g>
  </defs>

  <!-- Crisp Pearlescent Background Base -->
  <rect width="100%" height="100%" fill="url(#lightBase)"/>

  <!-- Tech Matrix Grid -->
  <rect width="100%" height="100%" fill="url(#lightGrid)"/>

  <!-- ========================================================================= -->
  <!-- RICH COLOR SMUDGES IN HOLLOW PORTIONS WHERE NO LOGO IS USED              -->
  <!-- ========================================================================= -->

  <!-- 1. Upper-Center Hollow Smudge -->
  <circle cx="960" cy="160" r="460" fill="url(#lightSmudgeUpperCenter)" filter="url(#nebulaSmudgeLight)"/>

  <!-- 2. Mid-Center Hollow Smudge -->
  <circle cx="960" cy="540" r="480" fill="url(#lightSmudgeMidCenter)" filter="url(#nebulaSmudgeLight)"/>

  <!-- 3. Left-Center Hollow Smudge -->
  <circle cx="80" cy="480" r="380" fill="url(#lightSmudgeLeftCenter)" filter="url(#nebulaSmudgeLight)"/>

  <!-- 4. Right-Center Hollow Smudge -->
  <circle cx="1840" cy="460" r="400" fill="url(#lightSmudgeRightCenter)" filter="url(#nebulaSmudgeLight)"/>

  <!-- 5. Bottom-Center Hollow Smudge -->
  <circle cx="960" cy="940" r="520" fill="url(#lightSmudgeBottomCenter)" filter="url(#nebulaSmudgeLight)"/>


  <!-- ========================================================================= -->
  <!-- EXACTLY 4 HIGH-GLOW & SHINING LOGOS IN THE 4 MAIN QUADRANTS              -->
  <!-- ========================================================================= -->

  <!-- ------------------------------------------------------------------------- -->
  <!-- 1. LOGO WATERMARK #1: TOP-RIGHT QUADRANT                                  -->
  <!-- ------------------------------------------------------------------------- -->
  <circle cx="1580" cy="190" r="260" fill="url(#haloCyanLight)" filter="url(#nebulaSmudgeLight)"/>
  <g transform="translate(1420, 60) scale(2.8)" opacity="0.45" filter="url(#intenseLightGlow)">
    <use href="#auraMailLogoLightWatermark"/>
  </g>

  <!-- ------------------------------------------------------------------------- -->
  <!-- 2. LOGO WATERMARK #2: TOP-LEFT QUADRANT                                   -->
  <!-- ------------------------------------------------------------------------- -->
  <circle cx="280" cy="220" r="260" fill="url(#haloIndigoLight)" filter="url(#nebulaSmudgeLight)"/>
  <g transform="translate(120, 90) scale(2.7)" opacity="0.42" filter="url(#intenseLightGlow)">
    <use href="#auraMailLogoLightWatermark"/>
  </g>

  <!-- ------------------------------------------------------------------------- -->
  <!-- 3. LOGO WATERMARK #3: BOTTOM-LEFT QUADRANT                                -->
  <!-- ------------------------------------------------------------------------- -->
  <circle cx="300" cy="780" r="270" fill="url(#haloPurpleLight)" filter="url(#nebulaSmudgeLight)"/>
  <g transform="translate(140, 640) scale(2.7)" opacity="0.42" filter="url(#intenseLightGlow)">
    <use href="#auraMailLogoLightWatermark"/>
  </g>

  <!-- ------------------------------------------------------------------------- -->
  <!-- 4. LOGO WATERMARK #4: BOTTOM-RIGHT QUADRANT                               -->
  <!-- ------------------------------------------------------------------------- -->
  <circle cx="1570" cy="770" r="280" fill="url(#haloTealLight)" filter="url(#nebulaSmudgeLight)"/>
  <g transform="translate(1400, 630) scale(2.8)" opacity="0.45" filter="url(#intenseLightGlow)">
    <use href="#auraMailLogoLightWatermark"/>
  </g>

</svg>
