<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <!-- Light Base -->
    <radialGradient id="lightBase" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#f8faff"/>
      <stop offset="50%" stop-color="#f1f5fd"/>
      <stop offset="100%" stop-color="#e8eefc"/>
    </radialGradient>

    <!-- Top Left Indigo Aurora -->
    <radialGradient id="lightIndigo" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#e0e7ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f1f5fd" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Right Cyan Aurora -->
    <radialGradient id="lightCyan" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f1f5fd" stop-opacity="0"/>
    </radialGradient>

    <!-- Light Grid Pattern -->
    <pattern id="lightGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(148, 163, 184, 0.12)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(99, 102, 241, 0.18)"/>
    </pattern>

    <filter id="lightBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#lightBase)"/>
  <rect width="100%" height="100%" fill="url(#lightGrid)"/>
  <circle cx="350" cy="200" r="520" fill="url(#lightIndigo)" filter="url(#lightBlur)"/>
  <circle cx="1600" cy="250" r="480" fill="url(#lightCyan)" filter="url(#lightBlur)"/>
</svg>
