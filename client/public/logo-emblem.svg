<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Sharp Vivid Cyber Ribbon Gradient -->
    <linearGradient id="emblemRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Top Flap Diamond Gradient -->
    <linearGradient id="emblemFlap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#67e8f9" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Razor-Sharp Crystalline Glint Highlight Gradient -->
    <linearGradient id="sharpGlint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="1" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Brilliant Radiant Star Gradient -->
    <linearGradient id="emblemStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fffbeb" />
      <stop offset="70%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Tight Razor-Sharp Neon Rim Filter -->
    <filter id="sharpNeonRim" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="rimGlow" />
      <feMerge>
        <feMergeNode in="rimGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Brilliant Lens Flare Sparkle Filter -->
    <filter id="intenseSparkle" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="starGlow" />
      <feMerge>
        <feMergeNode in="starGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- 1. GLOWING BASE STROKES (VIBRANT CYBER LUMINESCENCE)     -->
  <!-- ======================================================== -->
  <g filter="url(#sharpNeonRim)">
    <!-- Base Outer Shield -->
    <path d="M16 38 C16 30 22 24 30 24 L98 24 C106 24 112 30 112 38 L112 94 C112 102 106 108 98 108 L30 108 C22 108 16 102 16 94 Z" 
          fill="none" 
          stroke="url(#emblemRibbon)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Dynamic Fold Wings ('A' & 'M') -->
    <path d="M18 32 L64 74 L110 32" 
          fill="none" 
          stroke="url(#emblemFlap)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Bottom Flap Wings -->
    <path d="M18 100 L50 68" fill="none" stroke="url(#emblemRibbon)" stroke-width="6.5" stroke-linecap="round" stroke-opacity="0.95"/>
    <path d="M110 100 L78 68" fill="none" stroke="url(#emblemRibbon)" stroke-width="6.5" stroke-linecap="round" stroke-opacity="0.95"/>

    <!-- Central Neural AI Node (Clean & Authentic to Official Logo) -->
    <circle cx="64" cy="74" r="6" fill="#38bdf8"/>
    <circle cx="64" cy="74" r="2.5" fill="#ffffff"/>
  </g>

  <!-- ======================================================== -->
  <!-- 2. RAZOR-SHARP CRYSTALLINE INNER HIGHLIGHTS (DIAMOND CUT) -->
  <!-- ======================================================== -->
  <!-- Crisp Upper Rim Highlight -->
  <path d="M30 24 L98 24" 
        stroke="url(#sharpGlint)" 
        stroke-width="2" 
        stroke-linecap="round"/>

  <!-- Crisp Fold Apex Sharp Highlights -->
  <path d="M22 34 L64 72 L106 34" 
        stroke="#ffffff" 
        stroke-width="2" 
        stroke-linecap="round" 
        stroke-opacity="0.9"/>

  <!-- ======================================================== -->
  <!-- 3. OFFICIAL AI SPARK SHAPE DESIGN (ONLY ON TOP RIGHT)    -->
  <!-- ======================================================== -->
  <g transform="translate(86, 6)" filter="url(#intenseSparkle)">
    <!-- Lens Flare Spark Rays -->
    <line x1="16" y1="-10" x2="16" y2="40" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-10" y1="15" x2="42" y2="15" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-2" y1="-3" x2="34" y2="33" stroke="#fef08a" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
    <line x1="34" y1="-3" x2="-2" y2="33" stroke="#fef08a" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>

    <!-- Sharp Diamond Star Geometry (Exact Official AI Logo Spark) -->
    <path d="M16 0 L20.5 11 L32 15 L20.5 19 L16 30 L11.5 19 L0 15 L11.5 11 Z" fill="url(#emblemStar)"/>
    <circle cx="16" cy="15" r="4.5" fill="#ffffff"/>
    <circle cx="16" cy="15" r="2" fill="#fffbeb"/>
  </g>
</svg>
