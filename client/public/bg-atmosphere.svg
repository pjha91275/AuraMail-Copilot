<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <!-- Ultra-Deep Obsidian Dark Canvas Base -->
    <radialGradient id="baseGradDark" cx="50%" cy="30%" r="85%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#060914"/>
      <stop offset="50%" stop-color="#020408"/>
      <stop offset="100%" stop-color="#010204"/>
    </radialGradient>

    <!-- Top Left Indigo Nebula (Pure Deep Light, No Grey) -->
    <radialGradient id="nebulaIndigo" cx="15%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#312e81" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#010204" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Right Cyan Glow -->
    <radialGradient id="nebulaCyan" cx="85%" cy="20%" r="35%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#010204" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom Center Violet Aurora -->
    <radialGradient id="nebulaViolet" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#4c1d95" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#010204" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Cyber Matrix Grid (Ultra-clean, No Haze) -->
    <pattern id="cyberGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255, 255, 255, 0.025)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="rgba(99, 102, 241, 0.12)"/>
    </pattern>

    <!-- Official AuraMail Logo Mark Gradients -->
    <linearGradient id="logoRibbonDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="35%" stop-color="#4f46e5"/>
      <stop offset="70%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="logoFlapDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="logoStarDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur"/>
    </filter>

    <filter id="vectorGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Black Background Base -->
  <rect width="100%" height="100%" fill="url(#baseGradDark)"/>

  <!-- Subtle Clean Cyber Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#cyberGrid)"/>

  <!-- Deep Ambient Glow Points (Soft & Non-intrusive) -->
  <circle cx="300" cy="180" r="450" fill="url(#nebulaIndigo)" filter="url(#softGlow)"/>
  <circle cx="1650" cy="220" r="400" fill="url(#nebulaCyan)" filter="url(#softGlow)"/>
  <circle cx="960" cy="920" r="500" fill="url(#nebulaViolet)" filter="url(#softGlow)"/>

  <!-- ========================================================================= -->
  <!-- 1. OFFICIAL LOGO WATERMARK #1 (TOP-RIGHT: PURE VECTOR, ZERO GREY BUBBLE) -->
  <!-- ========================================================================= -->
  <g transform="translate(1420, 80) scale(2.6)" opacity="0.22" filter="url(#vectorGlow)">
    <!-- Base Envelope Shield Wings (No grey box, pure transparent glowing strokes) -->
    <path d="M16 38 C16 30 22 24 30 24 L98 24 C106 24 112 30 112 38 L112 94 C112 102 106 108 98 108 L30 108 C22 108 16 102 16 94 Z" 
          fill="none" 
          stroke="url(#logoRibbonDark)" 
          stroke-width="6.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Intersecting Wing Fold (Aura Wings 'A' / 'M') -->
    <path d="M18 32 L64 74 L110 32" 
          fill="none" 
          stroke="url(#logoFlapDark)" 
          stroke-width="6.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Bottom Wings -->
    <path d="M18 100 L50 68" fill="none" stroke="url(#logoRibbonDark)" stroke-width="5.5" stroke-linecap="round" stroke-opacity="0.9"/>
    <path d="M110 100 L78 68" fill="none" stroke="url(#logoRibbonDark)" stroke-width="5.5" stroke-linecap="round" stroke-opacity="0.9"/>

    <!-- Central Neural AI Node -->
    <circle cx="64" cy="74" r="5.5" fill="#38bdf8"/>
    <circle cx="64" cy="74" r="2" fill="#ffffff"/>

    <!-- Sparkle Star -->
    <g transform="translate(86, 10)">
      <path d="M16 0 L19.5 11.5 L31 15 L19.5 18.5 L16 30 L12.5 18.5 L1 15 L12.5 11.5 Z" fill="url(#logoStarDark)"/>
      <circle cx="16" cy="15" r="3" fill="#ffffff"/>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. OFFICIAL LOGO WATERMARK #2 (CENTER-LEFT: BEHIND INBOX THREADS)        -->
  <!-- ========================================================================= -->
  <g transform="translate(160, 320) scale(2.4)" opacity="0.18" filter="url(#vectorGlow)">
    <path d="M16 38 C16 30 22 24 30 24 L98 24 C106 24 112 30 112 38 L112 94 C112 102 106 108 98 108 L30 108 C22 108 16 102 16 94 Z" 
          fill="none" stroke="url(#logoRibbonDark)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 32 L64 74 L110 32" fill="none" stroke="url(#logoFlapDark)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M18 100 L50 68" fill="none" stroke="url(#logoRibbonDark)" stroke-width="5.5" stroke-linecap="round" stroke-opacity="0.9"/>
    <path d="M110 100 L78 68" fill="none" stroke="url(#logoRibbonDark)" stroke-width="5.5" stroke-linecap="round" stroke-opacity="0.9"/>
    <circle cx="64" cy="74" r="5.5" fill="#38bdf8"/>
    <g transform="translate(86, 10)">
      <path d="M16 0 L19.5 11.5 L31 15 L19.5 18.5 L16 30 L12.5 18.5 L1 15 L12.5 11.5 Z" fill="url(#logoStarDark)"/>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. OFFICIAL LOGO WATERMARK #3 (LOWER-RIGHT: QUADRANT BALANCE)            -->
  <!-- ========================================================================= -->
  <g transform="translate(1380, 680) scale(2.5)" opacity="0.18" filter="url(#vectorGlow)">
    <path d="M16 38 C16 30 22 24 30 24 L98 24 C106 24 112 30 112 38 L112 94 C112 102 106 108 98 108 L30 108 C22 108 16 102 16 94 Z" 
          fill="none" stroke="url(#logoRibbonDark)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 32 L64 74 L110 32" fill="none" stroke="url(#logoFlapDark)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M18 100 L50 68" fill="none" stroke="url(#logoRibbonDark)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M110 100 L78 68" fill="none" stroke="url(#logoRibbonDark)" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="64" cy="74" r="5.5" fill="#38bdf8"/>
    <g transform="translate(86, 10)">
      <path d="M16 0 L19.5 11.5 L31 15 L19.5 18.5 L16 30 L12.5 18.5 L1 15 L12.5 11.5 Z" fill="url(#logoStarDark)"/>
    </g>
  </g>

  <!-- Subtle Perspective Horizon Grid at the bottom -->
  <g opacity="0.3">
    <line x1="0" y1="880" x2="1920" y2="880" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    <line x1="0" y1="940" x2="1920" y2="940" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    <line x1="0" y1="1000" x2="1920" y2="1000" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
  </g>

  <!-- Ambient Vignette -->
  <radialGradient id="vignetteDark" cx="50%" cy="45%" r="65%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
  </radialGradient>
  <rect width="100%" height="100%" fill="url(#vignetteDark)"/>
</svg>
