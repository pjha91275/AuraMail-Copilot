<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <!-- Dark Canvas Base -->
    <radialGradient id="baseGrad" cx="50%" cy="30%" r="80%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#0e172e"/>
      <stop offset="45%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#03060d"/>
    </radialGradient>

    <!-- Top Left Indigo Nebula -->
    <radialGradient id="nebulaIndigo" cx="20%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#312e81" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080d1a" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Right Cyan Glow -->
    <radialGradient id="nebulaCyan" cx="82%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080d1a" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom Center Violet Aurora -->
    <radialGradient id="nebulaViolet" cx="50%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#4c1d95" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#080d1a" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="rgba(148, 163, 184, 0.15)"/>
    </pattern>

    <!-- Linear Shimmer Beams -->
    <linearGradient id="beam1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#080d1a" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="beam2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#080d1a" stop-opacity="0"/>
    </linearGradient>

    <!-- Filter for soft blur on cosmic clouds -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Solid Base -->
  <rect width="100%" height="100%" fill="url(#baseGrad)"/>

  <!-- High-Tech Cyber Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#cyberGrid)"/>

  <!-- Glowing Volumetric Nebula Blobs -->
  <circle cx="350" cy="200" r="500" fill="url(#nebulaIndigo)" filter="url(#softGlow)"/>
  <circle cx="1600" cy="250" r="480" fill="url(#nebulaCyan)" filter="url(#softGlow)"/>
  <circle cx="960" cy="900" r="600" fill="url(#nebulaViolet)" filter="url(#softGlow)"/>

  <!-- Elegant Digital Geometric Beams & Curves -->
  <path d="M -100,0 Q 600,400 1200,200 T 2020,400" fill="none" stroke="url(#beam1)" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.6"/>
  <path d="M -50,200 Q 500,700 1100,500 T 1970,700" fill="none" stroke="url(#beam2)" stroke-width="1.2" stroke-dasharray="12 16" opacity="0.45"/>
  <path d="M 200,-50 Q 960,350 1720,-50" fill="none" stroke="rgba(99, 102, 241, 0.12)" stroke-width="1"/>

  <!-- Perspective Horizon Grid at the bottom -->
  <g opacity="0.4">
    <line x1="0" y1="850" x2="1920" y2="850" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    <line x1="0" y1="920" x2="1920" y2="920" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <line x1="0" y1="980" x2="1920" y2="980" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <line x1="0" y1="1030" x2="1920" y2="1030" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <!-- Radiating perspective vanishing lines toward center horizon (960, 780) -->
    <line x1="960" y1="780" x2="100" y2="1080" stroke="rgba(99, 102, 241, 0.06)" stroke-width="1"/>
    <line x1="960" y1="780" x2="400" y2="1080" stroke="rgba(99, 102, 241, 0.06)" stroke-width="1"/>
    <line x1="960" y1="780" x2="700" y2="1080" stroke="rgba(99, 102, 241, 0.06)" stroke-width="1"/>
    <line x1="960" y1="780" x2="960" y2="1080" stroke="rgba(99, 102, 241, 0.08)" stroke-width="1"/>
    <line x1="960" y1="780" x2="1220" y2="1080" stroke="rgba(99, 102, 241, 0.06)" stroke-width="1"/>
    <line x1="960" y1="780" x2="1520" y2="1080" stroke="rgba(99, 102, 241, 0.06)" stroke-width="1"/>
    <line x1="960" y1="780" x2="1820" y2="1080" stroke="rgba(99, 102, 241, 0.06)" stroke-width="1"/>
  </g>

  <!-- High-Tech Constellation Particle Nodes -->
  <g fill="#a5b4fc" opacity="0.6">
    <circle cx="280" cy="180" r="2" />
    <circle cx="340" cy="140" r="1.5" />
    <circle cx="420" cy="220" r="2.5" />
    <circle cx="510" cy="160" r="1.5" />
    <line x1="280" y1="180" x2="340" y2="140" stroke="rgba(165, 180, 252, 0.2)" stroke-width="0.8"/>
    <line x1="340" y1="140" x2="420" y2="220" stroke="rgba(165, 180, 252, 0.2)" stroke-width="0.8"/>
    <line x1="420" y1="220" x2="510" y2="160" stroke="rgba(165, 180, 252, 0.2)" stroke-width="0.8"/>
  </g>

  <g fill="#67e8f9" opacity="0.55">
    <circle cx="1520" cy="190" r="2" />
    <circle cx="1600" cy="130" r="1.8" />
    <circle cx="1680" cy="210" r="2.2" />
    <line x1="1520" y1="190" x2="1600" y2="130" stroke="rgba(103, 232, 249, 0.2)" stroke-width="0.8"/>
    <line x1="1600" y1="130" x2="1680" y2="210" stroke="rgba(103, 232, 249, 0.2)" stroke-width="0.8"/>
  </g>

  <!-- Ambient Vignette to focus center content -->
  <radialGradient id="vignette" cx="50%" cy="45%" r="65%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#020409" stop-opacity="0.65"/>
  </radialGradient>
  <rect width="100%" height="100%" fill="url(#vignette)"/>
</svg>
