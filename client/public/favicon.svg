<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Aura Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="35%" stop-color="#4f46e5" />
      <stop offset="70%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Flap Accent Gradient -->
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Star Glow -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle (Edge to Edge) -->
  <rect x="2" y="2" width="124" height="124" rx="34" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="2.5"/>

  <!-- Inner Vibrant Rim -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="none" stroke="url(#ribbonGrad)" stroke-width="2" stroke-opacity="0.45"/>

  <!-- Large, Bold Stylized Aura Envelope Wings & "A" Shape (Expanded to fill 95% of space) -->
  <g filter="url(#auraGlow)">
    <!-- Base Envelope Shield -->
    <path d="M16 38 C16 30 22 24 30 24 L98 24 C106 24 112 30 112 38 L112 94 C112 102 106 108 98 108 L30 108 C22 108 16 102 16 94 Z" 
          fill="rgba(15, 23, 42, 0.4)" 
          stroke="url(#ribbonGrad)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Dynamic Intersecting Fold (Aura Wings 'A' & 'M') -->
    <path d="M18 32 L64 74 L110 32" 
          fill="none" 
          stroke="url(#flapGrad)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Bottom Wing Triangles -->
    <path d="M18 100 L50 68" 
          fill="none" 
          stroke="url(#ribbonGrad)" 
          stroke-width="6.5" 
          stroke-linecap="round" 
          stroke-opacity="0.85"/>
    <path d="M110 100 L78 68" 
          fill="none" 
          stroke="url(#ribbonGrad)" 
          stroke-width="6.5" 
          stroke-linecap="round" 
          stroke-opacity="0.85"/>

    <!-- Central Neural AI Node -->
    <circle cx="64" cy="74" r="6" fill="#38bdf8"/>
    <circle cx="64" cy="74" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Large Brilliant AI Sparkle Star (Top Right Corner) -->
  <g filter="url(#starGlow)" transform="translate(86, 10)">
    <path d="M16 0 L19.5 11.5 L31 15 L19.5 18.5 L16 30 L12.5 18.5 L1 15 L12.5 11.5 Z" fill="url(#starGrad)"/>
    <circle cx="16" cy="15" r="3.5" fill="#ffffff"/>
  </g>
</svg>
