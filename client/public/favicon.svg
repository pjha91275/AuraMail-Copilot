<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Aura Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Flap Accent Gradient -->
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Star Glow -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Subtle ambient inner glow ring -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="url(#ribbonGrad)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Stylized Aura Envelope Wings & "A" Shape -->
  <g filter="url(#auraGlow)">
    <!-- Base Envelope Shield -->
    <path d="M28 44 C28 38 33 34 40 34 L88 34 C95 34 100 38 100 44 L100 84 C100 90 95 94 88 94 L40 94 C33 94 28 90 28 84 Z" 
          fill="none" 
          stroke="url(#ribbonGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Dynamic Intersecting Fold (Forming letter 'A' and 'M') -->
    <path d="M30 40 L64 68 L98 40" 
          fill="none" 
          stroke="url(#flapGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Bottom Wing Triangles -->
    <path d="M30 88 L52 64" 
          fill="none" 
          stroke="url(#ribbonGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-opacity="0.8"/>
    <path d="M98 88 L76 64" 
          fill="none" 
          stroke="url(#ribbonGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-opacity="0.8"/>

    <!-- Central Neural AI Node -->
    <circle cx="64" cy="68" r="4.5" fill="#38bdf8"/>
  </g>

  <!-- Brilliant AI Sparkle Star (Top Right) -->
  <g filter="url(#starGlow)" transform="translate(86, 20)">
    <path d="M12 0 L14.5 8.5 L23 11 L14.5 13.5 L12 22 L9.5 13.5 L1 11 L9.5 8.5 Z" fill="url(#starGrad)"/>
    <circle cx="12" cy="11" r="2.5" fill="#ffffff"/>
  </g>
</svg>
