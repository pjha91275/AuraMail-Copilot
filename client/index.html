    <meta charset="UTF-8" />

    <title>AuraMail Copilot — Executive Email Assistant & Client Portal</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('auramail_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
